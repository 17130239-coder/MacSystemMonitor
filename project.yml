name: MacSystemMonitor
options:
  bundleIdPrefix: com.andynguyen
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: YG2VY6Q396
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    # Team-prefixed App Group (valid on macOS without portal registration).
    APP_GROUP_ID: "$(TeamIdentifierPrefix)com.andynguyen.MacSystemMonitor"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES

targets:
  MacSystemMonitor:
    type: application
    platform: macOS
    sources:
      - App
      - Shared
      - path: PreviewSupport
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mac Monitor
        CFBundleName: Mac Monitor
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "Copyright © 2026"
        AppGroupIdentifier: "$(APP_GROUP_ID)"
    entitlements:
      path: App/MacSystemMonitor.entitlements
      properties:
        # NOT sandboxed on purpose: AppleSMC / IOHID sensor access is blocked by the App Sandbox.
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andynguyen.MacSystemMonitor
        PRODUCT_NAME: "Mac Monitor"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MacSystemMonitorWidget
        embed: true

  MacSystemMonitorWidget:
    type: app-extension
    platform: macOS
    sources:
      - Widget
      - Shared
      - path: PreviewSupport
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Mac Monitor
        AppGroupIdentifier: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/MacSystemMonitorWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andynguyen.MacSystemMonitor.Widget
        PRODUCT_NAME: MacSystemMonitorWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  MacSystemMonitorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Shared/Models
      - Shared/Services
      - Shared/Utilities
      - Shared/Monitoring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andynguyen.MacSystemMonitor.Tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""

schemes:
  MacSystemMonitor:
    build:
      targets:
        MacSystemMonitor: all
    test:
      targets:
        - MacSystemMonitorTests
    run:
      config: Debug
